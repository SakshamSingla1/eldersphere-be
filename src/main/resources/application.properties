spring.application.name=${SPRING_APPLICATION_NAME:eldersphere}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173,http://localhost:3000}
app.url=${APP_URL:http://localhost:8080}

# ===============================
# POSTGRESQL / JPA CONFIGURATION
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# FLYWAY CONFIGURATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=true

# ===============================
# EMAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:no-reply@eldersphere.app}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:36000000}
jwt.refresh-token.expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

# ===============================
# PASSWORD RESET
# ===============================
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}

# ===============================
# LOCAL FILE STORAGE (fallback - see FILE STORAGE (Cloudinary) below)
# ===============================
app.file-storage.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.file-storage.public-base-url=${FILE_PUBLIC_BASE_URL:${app.url}/uploads}
# 100MB default - large enough for a short video clip (the smallest of the supported upload
# types - images/PDF/Word/Excel - was already comfortably under the old 10MB cap).
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:100MB}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=INFO

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ===============================
# RESPONSE COMPRESSION
# ===============================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===============================
# EMERGENCY ALERT SLA (fallback if PlatformSettings row is missing)
# ===============================
app.emergency.default-sla-minutes=${EMERGENCY_RESPONSE_SLA_MINUTES:5}

# ===============================
# WEB PUSH (VAPID) - see com.eldersphere.webpush.VapidKeyProvider
# ===============================
app.web-push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.web-push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.web-push.vapid.subject=${VAPID_SUBJECT:mailto:admin@eldersphere.app}

# ===============================
# ERROR TRACKING (Sentry, free tier) - sentry-spring-boot-starter no-ops when dsn is blank,
# so this is safe to leave unset in local dev.
# ===============================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.send-default-pii=false

# ===============================
# PAYMENTS (Stripe) - see com.eldersphere.config.StripeConfig. Blank secret-key means the
# gateway is inert - every payment code path fails clearly (PAYMENT_GATEWAY_NOT_CONFIGURED)
# rather than silently succeeding.
# ===============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===============================
# FILE STORAGE (Cloudinary) - see com.eldersphere.config.CloudinaryConfig and
# FileStorageServiceImpl. Blank cloud-name means Cloudinary is unconfigured, in which case
# uploads transparently fall back to local disk (app.file-storage.upload-dir below) - safe
# to leave unset in local dev.
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# GEOCODING (OpenStreetMap Nominatim, free, no API key) - see
# com.eldersphere.services.impl.GeocodingServiceImpl. Nominatim's usage policy requires a
# real contact identifier in the User-Agent header of every request.
# ===============================
app.geocoding.contact-email=${GEOCODING_CONTACT_EMAIL:admin@eldersphere.app}
